# CI for the local demo app: install deps, light syntax check, unit tests.
# No real secrets: tests use TestConfig fixtures; workflow only sets a dummy session key.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Match local demo (README: Python 3.10+)
    strategy:
      matrix:
        python-version: ["3.10"]

    env:
      # Dummy only — never a real production secret. Safe to appear in CI env.
      FLASK_SECRET_KEY: ci-dummy-secret-not-for-production
      FLASK_DEBUG: "0"
      # Prefer committed example config if anything loads file config outside TestConfig
      MONITOR_CONFIG: config.example.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Light syntax check
        run: python -m compileall -q app tests

      - name: Run unit tests
        run: pytest -q

      # Do not upload artifacts that could contain credentials or local config.
